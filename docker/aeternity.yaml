# yaml-language-server: $schema=https://github.com/aeternity/aeternity/raw/master/apps/aeutils/priv/aeternity_config_schema.json

system:
  dev_mode: true
  plugins:
    # TODO: remove once the node's built-in aedevmode emitter starts its own timers —
    # test/emitter drives emit_mb/emit_kb over this plugin's HTTP API on port 3313
    # instead. https://github.com/aeternity/aeternity/pull/4303 proposed that fix and was
    # closed without merging on 2024-04-10; as of 2026-08-20 the change is not on master
    # either.
    - name: aeplugin_dev_mode

http:
  internal:
    debug_endpoints: true
    listen_address: 0.0.0.0
  endpoints:
    dry-run: true

websocket:
  channel:
    listen_address: 0.0.0.0

chain:
  persist: false
  hard_forks:
    '1': 0
    '6': 1
  genesis_accounts:
    ak_21A27UVVt3hDkBE5J7rhhqnH5YNb4Y1dqo4PnSybrH85pnWo7E: 10000000000000000000000
