---
directive:
  - from: openapi-document
    where: $.components.schemas
    transform: >
      if ($doc.info.title === 'node') return $;
      ['UInt', 'UInt16', 'UInt32', 'UInt64', 'TxBlockHeight'].forEach(key => {
        $[key] = $[key].oneOf.find(({ type }) => type === 'integer');
      });
      const { utilization } = $.GasPrices.items.properties;
      Object.assign(utilization, {
        oneOf: undefined,
        ...utilization.oneOf.find(({ type }) => type === 'integer'),
      });
    reason: fix parsing of big numbers
      remove after fixing https://github.com/aeternity/aeternity/issues/3891

  - from: openapi-document
    where: $.components.schemas
    transform: >
      if ($doc.info.title === 'node') return $;
      function collapse(node) {
        if (node == null || typeof node !== 'object') return;
        Object.keys(node).forEach(function (key) {
          const value = node[key];
          if (value == null || typeof value !== 'object') return;
          const variants = value.oneOf;
          const integer = Array.isArray(variants) && variants.length === 2
            && variants.filter(function (v) { return v.type === 'integer'; })[0];
          const hasString = Array.isArray(variants)
            && variants.filter(function (v) { return v.type === 'string'; }).length === 1;
          if (integer && hasString) {
            delete value.oneOf;
            Object.assign(value, integer);
          } else if (Array.isArray(value.allOf) && value.allOf.length === 1) {
            const [only] = value.allOf;
            delete value.allOf;
            Object.assign(value, only);
          } else collapse(value);
        });
      }
      [
        'ProtocolParameters', 'NodeSettings', 'ProtocolConsensusParameters',
        'ContractTxBaseGas', 'StateGasPerBlock', 'NameAuctionTimeout', 'ContractVersion',
      ].forEach(function (key) { collapse({ schema: $[key] }); });
    reason: >
      protocol parameters inline the `integer | string` shape of UInt* instead of $ref-ing it,
      the string alternative is only about the `int-as-string` query parameter the SDK doesn't use

  - from: openapi-document
    where: $.components.schemas
    transform: >
      if ($doc.info.title === 'node') return $;
      const aettos = [
        'minimum_gas_price', 'min_miner_gas_price', 'name_claim_fees', 'name_claim_locked_fee',
      ];
      function toInteger(node) {
        if (node == null || typeof node !== 'object') return;
        Object.keys(node).forEach(function (key) {
          const value = node[key];
          if (value == null || typeof value !== 'object') return;
          if (aettos.indexOf(key) !== -1) {
            const leaf = value.type === 'array' ? value.items : value;
            if (leaf.type === 'string') leaf.type = 'integer';
          }
          toInteger(value);
        });
      }
      ['NodeSettings', 'ProtocolConsensusParameters']
        .forEach(function (key) { toInteger({ schema: $[key] }); });
    reason: >
      node reports aettos amounts as decimal strings, the largest name fee doesn't fit a double.
      `postprocessing.js` maps them to `bigint`, and the mapper it patches is the numeric one —
      the deserializer it installs reads a decimal string as well as a number

  - from: openapi-document
    where: $..[?(@.enum)]
    transform: '$["x-ms-enum"] = { modelAsString: false }'
    reason: thread enums as union of constants instead of arbitrary strings

  - from: openapi-document
    where: $.paths
    transform: >
      return Object.fromEntries(Object.entries($)
        .filter(([, p]) => Object.values(p)[0].tags.includes('external')))
    reason: keep only external endpoints

  - from: openapi-document
    where: $.components.schemas.Header
    transform: >
      return {
        "type": "object",
        "description": "A mix of KeyBlock, MicroBlockHeader properties.",
        "properties": {
          ...$doc.components.schemas.KeyBlock.properties,
          ...$doc.components.schemas.MicroBlockHeader.properties
        },
        "required": [
          "hash",
          "height",
          "prev_hash",
          "prev_key_hash",
          "state_hash",
          "time",
          "version"
        ]
      };

  - from: openapi-document
    where: $.components.schemas.Tx
    transform: >
      if ($doc.info.title === 'node') return $;
      const { discriminator, ...base } = $.allOf[0];
      const flatten = (schema) => {
        if (schema.$ref != null) {
          const path = schema.$ref.replace(/^#\//, '').split('/');
          return flatten(path.reduce((o, p) => o[p], $doc));
        }
        if (schema.allOf == null) {
          return { properties: schema.properties ?? {}, required: schema.required ?? [] };
        }
        const parts = schema.allOf.map(flatten);
        return {
          properties: Object.assign({}, ...parts.map(part => part.properties)),
          required: [...new Set(parts.flatMap(part => part.required))],
        };
      };
      const transactions = base.properties.type.enum
        .map(txName => flatten($doc.components.schemas[txName]));
      return {
        ...base,
        "description": "A mix of all transaction types.",
        "properties": Object.assign({}, ...transactions.map(tx => tx.properties), base.properties),
        "required": Object.entries(
          transactions
            .map(tx => tx.required)
            .reduce(
              (acc, req) => {
                req.forEach(r => acc[r] = (acc[r] ?? 0) + 1);
                return acc;
              },
              {}
            )
        )
          .filter(([, count]) => count === transactions.length)
          .map(([required]) => required)
          .concat(base.required)
      };

  - from: openapi-document
    where: $.components.schemas.Delegates
    transform: >
      if ($doc.info.title === 'node') return $;
      return $.oneOf[1];
    reason: use more precise form to avoid oneOf

  - from: openapi-document
    where: $.paths.*.*.parameters
    transform: return $.filter(({ $ref }) => !$ref?.endsWith('intAsString'))
    reason: remove intAsString parameter from paths

  - from: openapi-document
    where: $.components.parameters
    transform: 'return { ...$, intAsString: undefined }'
    reason: remove intAsString parameter from components

  - from: openapi-document
    where: $.paths.*.*.parameters[?(@.$ref)]
    transform: >
      const relativePath = $.$ref.replace(/^#\//, '').split('/');
      return relativePath.reduce((o, p) => o[p], $doc);
    reason: keep parameters in method options instead instance options

  - from: openapi-document
    where: $.servers
    transform: $ = []
    reason: remove a server with /v3 url

  - from: openapi-document
    where: $.paths
    transform: >
      const apiPrefix = '/v3';
      Object.keys($)
        .filter(a => !a.startsWith(apiPrefix))
        .forEach(key => {
          $[apiPrefix + key] = $[key];
          delete $[key];
        });
    reason: don't add prefix to $host parameter

  - from: openapi-document
    where: $.paths.*.*.responses
    transform: >
      Object.keys($)
        .filter((code) => code !== '200')
        .forEach((code) => {
          if ($[code].$ref != null) {
            const path = $[code].$ref.replace(/^#\//, '').split('/');
            $[code] = { ...path.reduce((o, p) => o[p], $doc) };
          }
          $[code]['x-ms-error-response'] = true;
        });
    reason: >
      throw errors even for explained response with not 200 code
      https://github.com/Azure/autorest.typescript/issues/463#issuecomment-524203041
      a `$ref`-ed response (`503` is one) ignores keys next to `$ref`, inline it before marking

  - from: openapi-document
    where: $..properties.time
    set:
      type: integer
      format: unixtime
    reason: >
      Convert time as milliseconds to dates
      https://github.com/aeternity/aeternity/issues/4386

  - from: openapi-document
    where: $.components.schemas
    transform: >
      $.SignedTx.required.push('block_height', 'block_hash', 'hash', 'signatures');
      $.SignedTxs.required = ['transactions'];
    reason: >
      marks additional fields as required
      remove after fixing https://github.com/aeternity/aeternity/issues/3892

  - from: openapi-document
    where: $.info.title
    set: node
    reason: the whole SDK already about aeternity

version: 3.7.2
use-extension:
  '@autorest/typescript': 6.0.55
  '@autorest/modelerfour': 4.27.2
input-file: https://raw.githubusercontent.com/aeternity/aeternity/v7.3.0-rc10/apps/aehttp/priv/oas3.yaml
output-folder: ../../src/apis/node
source-code-folder-path: .
generator: typescript
generate-metadata: false
add-credentials: false
modelerfour:
  seal-single-value-enum-by-default: false
