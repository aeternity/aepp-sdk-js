services:
  node:
    # TODO: switch to the master (non-bundle) image once the node's built-in aedevmode
    # emitter starts its own timers. https://github.com/aeternity/aeternity/pull/4303
    # proposed that fix and was closed without merging on 2024-04-10; as of 2026-08-20 the
    # change is not on master either, so block emission still goes through the
    # aeplugin_dev_mode plugin bundled in this image.
    image: aeternity/aeternity:v7.3.0-rc5-bundle
    # TODO: remove the 3313 port together with the aeplugin_dev_mode entry in
    # docker/aeternity.yaml, once the TODO above is resolved
    ports: [3013:3013, 3113:3113, 3014:3014, 3313:3313]
    # TODO: remove after releasing https://github.com/aeternity/aeternity/pull/4292
    healthcheck:
      interval: 2s
    volumes:
      - ./docker/aeternity.yaml:/home/aeternity/node/aeternity.yaml
    stop_grace_period: 0s

  emitter:
    build: test/emitter
    depends_on:
      node:
        condition: service_healthy

  compiler:
    image: aeternity/aesophia_http:v8.0.0
    ports: [3080:3080]
    # TODO: remove after releasing https://github.com/aeternity/aesophia_http/pull/133
    healthcheck:
      interval: 2s

  middleware:
    # TODO: use upstream after solving https://github.com/aeternity/ae_mdw/issues/1758
    image: davidyuk/temp:mdw-dev-mode-1.97.1-oas-fix
    ports: [4000:4000, 4001:4001, 4013:3013, 4014:3014, 4313:3313]
    volumes:
      - ./docker/middleware.yaml:/home/aeternity/aeternity.yaml
    stop_grace_period: 0s
